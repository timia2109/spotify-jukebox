name: Publish legacy v0.3 image

# One-time publication from the existing 0.3.0 release tag.
# This workflow lives on a dedicated branch so it does not change main
# or replace the release tag.
on:
  push:
    branches:
      - release/publish-0.3.0

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.3.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0.3.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/timia2109/spotify-jukebox:0.3
            ghcr.io/timia2109/spotify-jukebox:0.3.0
          labels: |
            org.opencontainers.image.source=https://github.com/timia2109/spotify-jukebox
            org.opencontainers.image.version=0.3.0
            org.opencontainers.image.revision=c757fbf10ba12a985820b35fcf7b6c9156818466
          provenance: false
